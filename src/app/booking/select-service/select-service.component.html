<div class="booking-container">
  <div class="booking-header">
    <h1>Book a Repair - Select Service</h1>
    <div class="progress-steps">
      <span class="step active">1. Select Service</span>
      <span class="step">2. Date & Time</span>
      <span class="step">3. Contact Details</span>
      <span class="step">4. Review</span>
    </div>
  </div>

  <div class="services-list">
    @for (service of services; track service) {
      <div
        class="service-item"
        role="button"
        tabindex="0"
        (click)="selectService(service)"
        (keyup.enter)="selectService(service)"
        (keyup.space)="selectService(service)">
        <h3>{{ service.name }}</h3>
        <p class="description">{{ service.description }}</p>
        <div class="service-info">
          <span class="price">${{ service.price }}</span>
          <span class="duration">{{ service.duration }} min</span>
        </div>
      </div>
    }
  </div>
</div>
