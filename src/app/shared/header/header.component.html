<header class="header">
  <div class="container">
    <div class="header-content">
      <div class="logo">
        <a routerLink="/">
          <h1>🚴 Bike Repair Shop</h1>
        </a>
      </div>
      <nav class="nav">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
        <a routerLink="/about" routerLinkActive="active">About</a>
        <a routerLink="/services" routerLinkActive="active">Services</a>
        <a routerLink="/contact" routerLinkActive="active">Contact</a>
        <a routerLink="/book" routerLinkActive="active" class="btn-primary">Book Repair</a>

        @if (currentUser) {
          <a routerLink="/my-appointments" routerLinkActive="active">My Appointments</a>
          @if (currentUser.role === 'admin') {
            <a routerLink="/admin" routerLinkActive="active">Admin</a>
          }
          <span class="user-name">{{ currentUser.name }}</span>
          <button (click)="logout()" class="btn-secondary">Logout</button>
        } @else {
          <a routerLink="/login" routerLinkActive="active" class="btn-secondary">Login</a>
        }
      </nav>
    </div>
  </div>
</header>
