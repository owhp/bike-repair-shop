<div class="services-page">
  <h1>Our Repair Services</h1>
  <p class="subtitle">Professional bike repair and maintenance services</p>

  <div class="services-grid">
    @for (service of services; track service) {
      <div class="service-card">
        <h3>{{ service.name }}</h3>
        <p class="description">{{ service.description }}</p>
        <div class="service-details">
          <div class="detail">
            <span class="label">Price:</span>
            <span class="value">${{ service.price }}</span>
          </div>
          <div class="detail">
            <span class="label">Duration:</span>
            <span class="value">{{ service.duration }} min</span>
          </div>
        </div>
        <a routerLink="/book" class="btn btn-primary">Book This Service</a>
      </div>
    }
  </div>
</div>
